name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; pull requests from forks never get secrets or write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (.NET 10)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Test shared logic
        run: dotnet test windows/tests/ConsoleTR.Core.Tests/ConsoleTR.Core.Tests.csproj -c Release
      - name: Build app
        run: dotnet publish windows/src/ConsoleTR.App/ConsoleTR.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Upload unsigned test build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ConsoleTR-windows-x64-unsigned
          path: publish/ConsoleTR.exe
          retention-days: 30

  macos:
    name: macOS (Swift 6)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build app
        run: xcodebuild -quiet -project macos/ConsoleTR.xcodeproj -scheme ConsoleTR -destination "platform=macOS,arch=arm64" -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY=- build
      # The suites need screen recording permission and Apple Translation languages,
      # which CI machines lack, so they are compiled here and run locally.
      - name: Compile test suites
        working-directory: macos
        run: |
          for suite in CaptureAccess LocalVideo WindowCapture MovingOverlay AutoDetect Ollama Pacing; do
            xcrun swiftc -swift-version 6 -target arm64-apple-macos26.0 Sources/{Core,Capture,Overlay,Controller}.swift "Tests/$suite.swift" -o "$RUNNER_TEMP/$suite"
          done
